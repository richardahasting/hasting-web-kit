# nginx vhost for feedback.hastingtx.org — serves three things:
#   /api/          -> the Flask feedback service (gunicorn on 127.0.0.1:8090)
#   /kit/v1/       -> the versioned kit assets (tokens.css, base.css, feedback.js)
#   /uploads/      -> stored screenshots
#
# Kit versioning: /var/www/feedback-kit/v1 is a COPY made at release time
# (see deploy/release-kit.sh), not a live checkout — pushing to the repo can
# never change what deployed sites load. A new release copies to v2/ and
# apps upgrade by changing their pin.
#
# Certs: issue with certbot as for the other hastingtx.org vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name feedback.hastingtx.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feedback.hastingtx.org;

    ssl_certificate     /etc/letsencrypt/live/feedback.hastingtx.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.hastingtx.org/privkey.pem;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;   # AI triage can take a while
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    location /kit/ {
        alias /var/www/feedback-kit/;
        add_header Cache-Control "public, max-age=86400";
        # ES modules load cross-origin in CORS mode — without this header
        # every consuming site's <script type="module"> would be refused.
        add_header Access-Control-Allow-Origin "*";
        types {
            text/css css;
            text/javascript js mjs;
        }
    }

    location /uploads/ {
        alias /var/www/feedback-uploads/;
        # Screenshots are user uploads: serve as inert downloads-friendly
        # content, never execute, never sniff.
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'";
        types {
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    location = / {
        return 302 https://hastingtx.org;
    }
}
